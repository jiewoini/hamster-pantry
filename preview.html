<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>猫爪收纳局 · 本地试玩</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#e4e5dc;display:grid;place-items:center;height:100dvh;overflow:hidden;font-family:system-ui}canvas{display:block;width:min(100vw,440px);height:100dvh;touch-action:none;box-shadow:0 0 70px #6e765321}
  dialog{width:min(320px,calc(100vw - 36px));border:0;border-radius:22px;padding:23px;background:#fffdf8;color:#454d38;box-shadow:0 12px 45px #45372e33}
  dialog::backdrop{background:#332e255c}
  dialog label{display:block;font-size:18px;font-weight:700;margin-bottom:12px}
  dialog input{width:100%;border:1px solid #a4ad92;border-radius:11px;padding:11px;font:inherit;color:inherit;background:#faf7ef}
  .name-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .name-actions button{font:inherit;border:0;border-radius:11px;padding:8px 16px;background:#ebe7dd;color:#454d38;cursor:pointer}
  .name-actions button[type=submit]{background:#657f5a;color:white}
</style>
<canvas id="game" aria-label="猫爪收纳局，选一只小猫、给它起名，再玩收纳赚取物资"></canvas>
<dialog id="name-dialog">
  <form method="dialog">
    <label for="cat-name">小猫叫什么？</label>
    <input id="cat-name" autocomplete="off" placeholder="最多 8 个字" required>
    <div class="name-actions">
      <button type="submit" value="cancel" formnovalidate>取消</button>
      <button type="submit" value="save">确定</button>
    </div>
  </form>
</dialog>
<script src="engine.js"></script><script src="cat-care.js"></script><script src="view.js"></script>
<script>
  const canvas = document.getElementById('game')
  const nameDialog = document.getElementById('name-dialog')
  const nameInput = document.getElementById('cat-name')
  const platform = {
    read(key) { try { return localStorage.getItem(key) || 0 } catch (error) { return 0 } },
    write(key, value) { try { localStorage.setItem(key, value) } catch (error) {} },
    vibrate() {},
    openPrivacy() {
      window.alert('本游戏仅在本机浏览器保存进度，不收集个人信息、不联网，无第三方 SDK。')
    },
    requestName(current, done) {
      nameDialog.returnValue = ''
      nameInput.value = current
      nameDialog.addEventListener('close', () => done(nameDialog.returnValue === 'save' ? nameInput.value : undefined), { once: true })
      nameDialog.showModal()
      nameInput.select()
    }
  }
  function limitName() {
    if ([...nameInput.value].length > 8) nameInput.value = [...nameInput.value].slice(0, 8).join('')
  }
  nameInput.addEventListener('compositionend', limitName)
  nameInput.addEventListener('input', event => {
    if (!event.isComposing) limitName()
  })
  nameInput.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.isComposing) {
      event.preventDefault()
      if (nameInput.reportValidity()) nameDialog.close('save')
    }
  })
  const view = new PantryView.PantryView(canvas, PantryEngine, platform)
  function resize() { const r = canvas.getBoundingClientRect(); view.resize(r.width, r.height, Math.min(devicePixelRatio || 1, 3)) }
  function local(event) { const r = canvas.getBoundingClientRect(); return [event.clientX - r.left, event.clientY - r.top] }
  canvas.addEventListener('pointerdown', event => { canvas.setPointerCapture(event.pointerId); view.down(...local(event)) })
  canvas.addEventListener('pointermove', event => view.move(...local(event)))
  canvas.addEventListener('pointerup', event => view.up(...local(event)))
  canvas.addEventListener('pointercancel', () => view.cancel())
  window.addEventListener('resize', resize)
  document.addEventListener('visibilitychange', () => document.hidden ? view.suspend() : view.resume())
  resize()
</script>
</html>
